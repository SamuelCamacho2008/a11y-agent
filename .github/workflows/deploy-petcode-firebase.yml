name: Deploy PetCode to Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - "petcode/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-petcode-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: petcode/package-lock.json

      - name: Install PetCode dependencies
        run: npm ci --prefix petcode

      - name: Build PetCode
        run: npm run build --prefix petcode
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.PETCODE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.PETCODE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.PETCODE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.PETCODE_FIREBASE_APP_ID }}

      - name: Deploy PetCode to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PETCODE_RESCUE_SAMUEL }}
          projectId: petcode-rescue-samuel
          channelId: live
